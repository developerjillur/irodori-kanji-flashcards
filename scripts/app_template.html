<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irodori Kanji Flashcards</title>
<style>
  :root {
    --bg: #f6f2ea; --surface: #fffdf9; --ink: #231f20; --muted: #6f6a66; --line: #e2dbd0;
    --accent: #b10f1f; --accent-soft: #f7e4e1; --shadow: 0 10px 30px rgba(35, 31, 32, .10);
    --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", sans-serif;
    --bn: "Kohinoor Bangla", "Hind Siliguri", "Noto Sans Bengali", "Bangla Sangam MN", "Nirmala UI", "Vrinda", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171514; --surface: #221f1e; --ink: #f3eee8; --muted: #a59e97; --line: #3a3532;
      --accent-soft: #3a2224; --shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  }
  [data-book="starter"] { --accent: #b10f1f; --accent-soft: #f7e4e1; }
  [data-book="elementary1"] { --accent: #00558f; --accent-soft: #dfeaf3; }
  [data-book="elementary2"] { --accent: #5e3a7b; --accent-soft: #ebe3f1; }
  [data-book="kanji"] { --accent: #0f6b5c; --accent-soft: #dcefeb; }
  @media (prefers-color-scheme: dark) {
    [data-book="starter"] { --accent: #ef6a73; --accent-soft: #3a2224; }
    [data-book="elementary1"] { --accent: #6db3e6; --accent-soft: #1d2f3d; }
    [data-book="elementary2"] { --accent: #b995d6; --accent-soft: #2f2639; }
    [data-book="kanji"] { --accent: #63c7b4; --accent-soft: #1c3531; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--bn); font-size: 17px; line-height: 1.55;
    min-height: 100vh; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 56px; }
  header.top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .brand { font-family: var(--jp); font-weight: 700; font-size: 1.05rem; letter-spacing: .02em; color: var(--ink);
    text-decoration: none; display: flex; align-items: center; gap: 10px; }
  .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; display: grid;
    place-items: center; font-size: 1.15rem; }
  nav.crumbs { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: .95rem; flex-wrap: wrap; }
  nav.crumbs a { color: var(--accent); text-decoration: none; padding: 4px 2px; }
  nav.crumbs a:hover { text-decoration: underline; }
  h1 { font-size: 1.7rem; line-height: 1.25; margin: 0 0 6px; }
  p.lead { color: var(--muted); margin: 0 0 22px; max-width: 60ch; }
  .books { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
  .book { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line);
    border-radius: 18px; padding: 22px 20px 20px; box-shadow: var(--shadow); border-top: 6px solid var(--accent);
    transition: transform .15s ease, box-shadow .15s ease; }
  .book:hover, .book:focus-visible { transform: translateY(-3px); }
  .book .jp { font-family: var(--jp); color: var(--accent); font-weight: 700; font-size: 1.5rem; }
  .book .name { font-size: 1.25rem; font-weight: 700; margin-top: 2px; font-family: var(--jp); }
  .book .bn { color: var(--muted); }
  .book .meta { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px;
    padding: 3px 11px; font-size: .86rem; font-weight: 600; }
  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .lesson { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px 14px 12px; transition: transform .12s ease, border-color .12s ease; }
  .lesson:hover, .lesson:focus-visible { transform: translateY(-2px); border-color: var(--accent); }
  .lesson .no { font-family: var(--jp); font-weight: 700; font-size: 1.1rem; }
  .lesson .jp { font-family: var(--jp); color: var(--muted); font-size: .85rem; }
  .lesson .count { margin-top: 8px; color: var(--accent); font-weight: 700; }
  .lesson .of { color: var(--muted); font-size: .8rem; }
  h2.sec { font-size: 1.05rem; margin: 30px 0 4px; }
  p.secnote { color: var(--muted); margin: 0 0 14px; font-size: .95rem; max-width: 62ch; }
  .lesson .lt { font-family: var(--jp); color: var(--muted); font-size: .78rem; line-height: 1.35; margin-top: 2px; }
  .lesson.none { opacity: .55; border-style: dashed; }
  .lesson.none:hover { transform: none; border-color: var(--line); }
  .deckbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .deckbar h1 { font-size: 1.3rem; margin: 0; font-family: var(--jp); }
  .counter { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); font-size: 1.05rem; }
  .progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 18px; }
  .progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s ease; }
  .stage { perspective: 1400px; }
  .card { display: block; width: 100%; border: 0; padding: 0; background: none; color: inherit; cursor: pointer;
    font: inherit; text-align: center; -webkit-tap-highlight-color: transparent; }
  .card:focus-visible .face { outline: 3px solid var(--accent); outline-offset: 3px; }
  .inner { position: relative; width: 100%; min-height: min(56vh, 420px); transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2, .7, .2, 1); display: grid; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .card.noanim .inner { transition: none; }
  .face { grid-area: 1 / 1; position: relative; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface);
    border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); padding: 28px 22px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .face.back { transform: rotateY(180deg); border-top: 6px solid var(--accent); }
  .side { position: absolute; top: 14px; left: 18px; font-size: .78rem; color: var(--muted); letter-spacing: .04em; }
  .word { font-family: var(--jp); font-weight: 600; line-height: 1.3; word-break: break-word; overflow-wrap: anywhere; }
  .word.s1 { font-size: clamp(3.4rem, 13vw, 6rem); }
  .word.s2 { font-size: clamp(2.6rem, 9vw, 4.2rem); }
  .word.s3 { font-size: clamp(1.9rem, 6.4vw, 3rem); }
  .word.s4 { font-size: clamp(1.4rem, 4.6vw, 2.1rem); }
  .hint { color: var(--muted); font-size: .9rem; }
  .reading { font-family: var(--jp); color: var(--accent); font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
  .reading.s1 { font-size: clamp(2.2rem, 8vw, 3.4rem); }
  .reading.s2 { font-size: clamp(1.8rem, 6vw, 2.6rem); }
  .reading.s3 { font-size: clamp(1.35rem, 4.6vw, 1.9rem); }
  .reading.s4 { font-size: clamp(1.1rem, 3.6vw, 1.45rem); }
  .backword { font-family: var(--jp); color: var(--muted); font-size: 1.05rem; }
  .meaning { font-size: clamp(1.25rem, 4.2vw, 1.7rem); line-height: 1.5; max-width: 30ch; }
  .meaning b { font-weight: 600; color: var(--muted); font-size: .72em; display: block; letter-spacing: .01em; }
  .en { color: var(--muted); font-size: .95rem; font-family: var(--jp); max-width: 46ch; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tag { border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 1px 10px; font-size: .78rem; }
  .controls { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 10px; margin-top: 18px; }
  button.btn { font: inherit; font-weight: 700; border-radius: 14px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); padding: 13px 10px; cursor: pointer; transition: transform .08s ease, border-color .12s ease; }
  button.btn:hover { border-color: var(--accent); }
  button.btn:active { transform: scale(.98); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.btn.primary { color: #171514; } }
  button.btn:disabled { opacity: .4; cursor: default; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
  button.chip { font: inherit; font-size: .92rem; border-radius: 999px; border: 1px solid var(--line); background: transparent;
    color: var(--muted); padding: 7px 14px; cursor: pointer; }
  button.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); font-weight: 700; }
  .keys { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 14px; }
  kbd { font: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; background: var(--surface); }
  .empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 16px; padding: 28px; text-align: center; color: var(--muted); }
  footer.note { margin-top: 34px; color: var(--muted); font-size: .82rem; text-align: center; }
  @media (max-width: 520px) { .controls { grid-template-columns: 1fr 1fr; } .controls .flip { grid-column: 1 / -1; order: -1; } .keys { display: none; } }
  @media (prefers-reduced-motion: reduce) { .inner, .book, .lesson, .progress i { transition: none; } }
</style>
</head>
<body>
<div class="wrap" id="root">
  <header class="top">
    <a class="brand" href="#/"><span class="mark">漢</span><span>Irodori Kanji Flashcards</span></a>
    <nav class="crumbs" id="crumbs" aria-label="অবস্থান"></nav>
  </header>
  <main id="app"></main>
  <footer class="note">শব্দ, উচ্চারণ ও ক্রম: The Japan Foundation-এর「いろどり 生活の日本語」ことばリスト (Ver. 2021/10/01)। বাংলা অর্থ আলাদাভাবে লেখা। Irodori Kanji অংশ: আলাদা kanji PDF (漢字のことば, furigana ও বাংলা অর্থসহ)।</footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const KANJI = /*__KANJI__*/null;
</script>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var crumbs = document.getElementById("crumbs");
  var root = document.getElementById("root");
  var BN_DIGITS = ["০", "১", "২", "৩", "৪", "৫", "৬", "৭", "৮", "৯"];
  function bn(n) { return String(n).replace(/[0-9]/g, function (d) { return BN_DIGITS[+d]; }); }
  function el(tag, attrs, kids) {
    var node = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function (kid) { if (kid) node.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid); });
    return node;
  }
  function pref(key, value) {
    try {
      if (value === undefined) return localStorage.getItem("ikf." + key);
      localStorage.setItem("ikf." + key, value);
    } catch (e) { return null; }
  }
  function findBook(key) { return DATA.books.filter(function (b) { return b.key === key; })[0]; }
  function total(book) { return book.lessons.reduce(function (s, l) { return s + l.cards.length; }, 0); }
  function sizeClass(text) {
    var n = Array.from(text).length;
    return n <= 4 ? "s1" : n <= 8 ? "s2" : n <= 15 ? "s3" : "s4";
  }
  var deck = null; // state of the open deck
  var keyHandler = null;

  function setCrumbs(items) {
    crumbs.innerHTML = "";
    items.forEach(function (it, i) {
      if (i) crumbs.appendChild(el("span", { text: "›", "aria-hidden": "true" }));
      crumbs.appendChild(it.href ? el("a", { href: it.href, text: it.text }) : el("span", { text: it.text }));
    });
  }

  function viewHome() {
    root.removeAttribute("data-book");
    setCrumbs([]);
    document.title = "Irodori Kanji Flashcards";
    var all = DATA.books.reduce(function (s, b) { return s + total(b); }, 0);
    app.innerHTML = "";
    app.appendChild(el("h1", { text: "কী পড়বেন?" }));
    app.appendChild(el("h2", { class: "sec", text: "Vocabulary: kanji থাকা শব্দ" }));
    app.appendChild(el("p", { class: "secnote", text: "Irodori-র তিন বইয়ের প্রতিটা lesson-এর শুধু kanji থাকা শব্দ। মোট " + bn(all) + "টা card, lesson ধরে আলাদা deck।" }));
    var grid = el("div", { class: "books" });
    DATA.books.forEach(function (b) {
      grid.appendChild(el("a", { class: "book", href: "#/" + b.key, "data-book": b.key }, [
        el("div", { class: "jp", text: b.jp }),
        el("div", { class: "name", text: b.title }),
        el("div", { class: "bn", text: b.bn }),
        el("div", { class: "meta" }, [
          el("span", { class: "pill", text: bn(b.lessons.length) + "টা lesson" }),
          el("span", { class: "pill", text: bn(total(b)) + "টা card" })
        ])
      ]));
    });
    app.appendChild(grid);
    if (KANJI) {
      app.appendChild(el("h2", { class: "sec", text: "Irodori Kanji: আলাদা category" }));
      app.appendChild(el("p", { class: "secnote", text: "আলাদা kanji PDF থেকে নেওয়া kanji-র শব্দ (漢字のことば), lesson ধরে। উপরের vocabulary deck-এর সাথে এর কোনো মিশ্রণ নেই।" }));
      var kgrid = el("div", { class: "books" });
      kgrid.appendChild(el("a", { class: "book", href: "#/kanji", "data-book": "kanji" }, [
        el("div", { class: "jp", text: "漢字" }),
        el("div", { class: "name", text: "Irodori Kanji" }),
        el("div", { class: "bn", text: "ইরোদোরি কানজি" }),
        el("div", { class: "meta" }, [
          el("span", { class: "pill", text: bn(KANJI.books.length) + "টা বই" }),
          el("span", { class: "pill", text: bn(kanjiAll().length) + "টা card" })
        ])
      ]));
      app.appendChild(kgrid);
    }
  }

  // ---- the separate Irodori Kanji category (its own data, routes and decks) ----
  function kanjiAll() {
    var out = [];
    KANJI.books.forEach(function (b) { b.lessons.forEach(function (l) { l.cards.forEach(function (c) {
      out.push({ id: c.id, w: c.w, r: c.r, bn: c.bn, src: b.title + " · Lesson " + l.n });
    }); }); });
    return out;
  }
  function viewKanjiHome() {
    root.setAttribute("data-book", "kanji");
    setCrumbs([{ text: "সব বই", href: "#/" }, { text: "Irodori Kanji" }]);
    document.title = "Irodori Kanji · Irodori Kanji Flashcards";
    app.innerHTML = "";
    app.appendChild(el("h1", { text: "Irodori Kanji (漢字)" }));
    app.appendChild(el("p", { class: "lead", text: "বই বেছে lesson ধরে পড়ুন, অথবা সব kanji একসাথে এক deck-এ। Pre-Intermediate-এর kanji এখানে নেই।" }));
    var grid = el("div", { class: "books" });
    KANJI.books.forEach(function (b) {
      var withCards = b.lessons.filter(function (l) { return l.cards.length; }).length;
      grid.appendChild(el("a", { class: "book", href: "#/kanji/" + b.key }, [
        el("div", { class: "jp", text: b.jp }),
        el("div", { class: "name", text: b.title }),
        el("div", { class: "bn", text: b.bn }),
        el("div", { class: "meta" }, [
          el("span", { class: "pill", text: bn(withCards) + "টা lesson-এ kanji" }),
          el("span", { class: "pill", text: bn(total(b)) + "টা card" })
        ])
      ]));
    });
    grid.appendChild(el("a", { class: "book", href: "#/kanji/all" }, [
      el("div", { class: "jp", text: "全部" }),
      el("div", { class: "name", text: "All Irodori Kanji" }),
      el("div", { class: "bn", text: "তিন বইয়ের সব kanji একসাথে" }),
      el("div", { class: "meta" }, [el("span", { class: "pill", text: bn(kanjiAll().length) + "টা card, এক deck" })])
    ]));
    app.appendChild(grid);
  }
  function viewKanjiBook(book) {
    root.setAttribute("data-book", "kanji");
    setCrumbs([{ text: "সব বই", href: "#/" }, { text: "Irodori Kanji", href: "#/kanji" }, { text: book.title }]);
    document.title = "Irodori Kanji " + book.title + " · Irodori Kanji Flashcards";
    app.innerHTML = "";
    app.appendChild(el("h1", { text: "Irodori Kanji · " + book.title + " (" + book.jp + ")" }));
    app.appendChild(el("p", { class: "lead", text: "Lesson বেছে নিন। প্রতিটা lesson-এর kanji আলাদা deck।" }));
    var grid = el("div", { class: "lessons" });
    book.lessons.forEach(function (l) {
      if (!l.cards.length) {
        grid.appendChild(el("div", { class: "lesson none" }, [
          el("div", { class: "no", text: "Lesson " + l.n }),
          el("div", { class: "of", text: "kanji PDF-এ এই lesson-এ কিছু নেই" })
        ]));
        return;
      }
      grid.appendChild(el("a", { class: "lesson", href: "#/kanji/" + book.key + "/" + l.n }, [
        el("div", { class: "no", text: "Lesson " + l.n }),
        el("div", { class: "lt", lang: "ja", text: l.title }),
        el("div", { class: "count", text: bn(l.cards.length) + "টা card" })
      ]));
    });
    app.appendChild(grid);
  }
  function routeKanji(parts) {
    if (parts[1] === "all") {
      openDeck({ color: "kanji", title: "All Irodori Kanji", docTitle: "All Irodori Kanji", cards: kanjiAll(), english: false,
        crumbs: [{ text: "সব বই", href: "#/" }, { text: "Irodori Kanji", href: "#/kanji" }, { text: "All Irodori Kanji" }] });
      return;
    }
    var book = parts[1] ? KANJI.books.filter(function (b) { return b.key === parts[1]; })[0] : null;
    if (!book) { viewKanjiHome(); return; }
    var n = parseInt(parts[2], 10);
    var lesson = n ? book.lessons.filter(function (l) { return l.n === n; })[0] : null;
    if (!lesson) { viewKanjiBook(book); return; }
    openDeck({ color: "kanji", title: "Kanji · " + book.title + " · Lesson " + lesson.n, docTitle: "Irodori Kanji " + book.title + " Lesson " + lesson.n,
      cards: lesson.cards, english: false, emptyText: "kanji PDF-এ এই lesson-এ কোনো kanji নেই।",
      crumbs: [{ text: "সব বই", href: "#/" }, { text: "Irodori Kanji", href: "#/kanji" }, { text: book.title, href: "#/kanji/" + book.key }, { text: "Lesson " + lesson.n }] });
  }

  function viewBook(book) {
    root.setAttribute("data-book", book.key);
    setCrumbs([{ text: "সব বই", href: "#/" }, { text: book.title }]);
    document.title = book.title + " · Irodori Kanji Flashcards";
    app.innerHTML = "";
    app.appendChild(el("h1", { text: book.title + " (" + book.jp + ")" }));
    app.appendChild(el("p", { class: "lead", text: "Lesson বেছে নিন। প্রতিটা lesson আলাদা deck; সংখ্যাটা ওই lesson-এর kanji থাকা শব্দ।" }));
    var grid = el("div", { class: "lessons" });
    book.lessons.forEach(function (l) {
      grid.appendChild(el("a", { class: "lesson", href: "#/" + book.key + "/" + l.n }, [
        el("div", { class: "no", text: "Lesson " + l.n }),
        el("div", { class: "jp", text: "第" + l.n + "課" }),
        el("div", { class: "count", text: bn(l.cards.length) + "টা card" }),
        el("div", { class: "of", text: "lesson-এর মোট " + bn(l.entries) + " শব্দের মধ্যে" })
      ]));
    });
    app.appendChild(grid);
  }

  function shuffled(n) {
    var a = []; for (var i = 0; i < n; i++) a.push(i);
    for (var j = n - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; }
    return a;
  }

  function viewDeck(book, lesson) {
    openDeck({ color: book.key, title: book.title + " · Lesson " + lesson.n, docTitle: book.title + " Lesson " + lesson.n,
      cards: lesson.cards, english: true, emptyText: "এই lesson-এ kanji থাকা কোনো শব্দ নেই।",
      crumbs: [{ text: "সব বই", href: "#/" }, { text: book.title, href: "#/" + book.key }, { text: "Lesson " + lesson.n }] });
  }

  function openDeck(o) {
    root.setAttribute("data-book", o.color);
    setCrumbs(o.crumbs);
    document.title = o.docTitle + " · Irodori Kanji Flashcards";
    app.innerHTML = "";
    var cards = o.cards;
    if (!cards.length) {
      app.appendChild(el("div", { class: "empty", text: o.emptyText || "এই deck-এ কোনো card নেই।" }));
      return;
    }
    deck = { cards: cards, order: cards.map(function (_, i) { return i; }), pos: 0, flipped: false,
      shuffle: pref("shuffle") === "1", english: !!o.english && pref("english") === "1" };
    if (deck.shuffle) deck.order = shuffled(cards.length);

    var counter = el("div", { class: "counter", "aria-live": "polite" });
    var bar = el("i");
    var word = el("div", { class: "word", lang: "ja" });
    var reading = el("div", { class: "reading", lang: "ja" });
    var backword = el("div", { class: "backword", lang: "ja" });
    var meaning = el("div", { class: "meaning" });
    var en = el("div", { class: "en", lang: "en" });
    var tags = el("div", { class: "tags" });
    var card = el("button", { class: "card", type: "button", "aria-label": "card উল্টাও" }, [
      el("div", { class: "inner" }, [
        el("div", { class: "face front" }, [el("span", { class: "side", text: "সামনে" }), word, el("div", { class: "hint", text: "উল্টাতে চাপ দিন" })]),
        el("div", { class: "face back" }, [el("span", { class: "side", text: "পেছনে" }), backword, reading, meaning, en, tags])
      ])
    ]);
    var prev = el("button", { class: "btn", type: "button", text: "← আগের" });
    var flip = el("button", { class: "btn primary flip", type: "button", text: "উল্টাও" });
    var next = el("button", { class: "btn", type: "button", text: "পরের →" });
    var shuf = el("button", { class: "chip", type: "button", text: "এলোমেলো (shuffle)" });
    var eng = el("button", { class: "chip", type: "button", text: "English অর্থও দেখাও" });
    var again = el("button", { class: "chip", type: "button", text: "শুরু থেকে" });

    function render() {
      var c = deck.cards[deck.order[deck.pos]];
      card.classList.add("noanim");
      card.classList.remove("flipped");
      deck.flipped = false;
      word.textContent = c.w; word.className = "word " + sizeClass(c.w);
      backword.textContent = c.w;
      reading.textContent = c.r; reading.className = "reading " + sizeClass(c.r);
      meaning.innerHTML = "";
      meaning.appendChild(el("b", { text: "বাংলা অর্থ:" }));
      meaning.appendChild(document.createTextNode(c.bn));
      en.textContent = deck.english ? c.en : ""; en.style.display = deck.english ? "" : "none";
      tags.innerHTML = "";
      if (c.g) tags.appendChild(el("span", { class: "tag", text: "ক্রিয়া, গ্রুপ " + bn(c.g) }));
      if (c.x) tags.appendChild(el("span", { class: "tag", text: "বাক্য বা expression" }));
      if (c.rp) tags.appendChild(el("span", { class: "tag", text: "↺ আগের lesson-এও এসেছে" }));
      if (c.rf) tags.appendChild(el("span", { class: "tag", text: "reference শব্দ" }));
      if (c.src) tags.appendChild(el("span", { class: "tag", text: c.src }));
      counter.textContent = bn(deck.pos + 1) + " / " + bn(deck.cards.length);
      bar.style.width = ((deck.pos + 1) / deck.cards.length * 100) + "%";
      prev.disabled = deck.pos === 0;
      next.textContent = deck.pos === deck.cards.length - 1 ? "আবার শুরু ↺" : "পরের →";
      shuf.setAttribute("aria-pressed", deck.shuffle ? "true" : "false");
      eng.setAttribute("aria-pressed", deck.english ? "true" : "false");
      void card.offsetWidth;
      card.classList.remove("noanim");
    }
    function doFlip() { deck.flipped = !deck.flipped; card.classList.toggle("flipped", deck.flipped); }
    function go(d) {
      var n = deck.pos + d;
      if (n >= deck.cards.length) n = 0;
      if (n < 0) return;
      deck.pos = n; render();
    }
    card.addEventListener("click", doFlip);
    flip.addEventListener("click", doFlip);
    prev.addEventListener("click", function () { go(-1); });
    next.addEventListener("click", function () { go(1); });
    shuf.addEventListener("click", function () {
      deck.shuffle = !deck.shuffle; pref("shuffle", deck.shuffle ? "1" : "0");
      deck.order = deck.shuffle ? shuffled(deck.cards.length) : deck.cards.map(function (_, i) { return i; });
      deck.pos = 0; render();
    });
    eng.addEventListener("click", function () { deck.english = !deck.english; pref("english", deck.english ? "1" : "0");
      var keep = deck.flipped; render(); if (keep) { card.classList.add("noanim"); doFlip(); void card.offsetWidth; card.classList.remove("noanim"); } });
    again.addEventListener("click", function () { deck.pos = 0; render(); });
    var x0 = null;
    card.addEventListener("touchstart", function (e) { x0 = e.changedTouches[0].clientX; }, { passive: true });
    card.addEventListener("touchend", function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 60) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
    });
    keyHandler = function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === "ArrowRight") { go(1); e.preventDefault(); }
      else if (e.key === "ArrowLeft") { go(-1); e.preventDefault(); }
      else if (e.key === " " || e.key === "ArrowUp" || e.key === "ArrowDown") { doFlip(); e.preventDefault(); }
      else if (e.key === "Enter") {
        if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
        doFlip(); e.preventDefault();
      } else if (e.key === "s" || e.key === "S") { shuf.click(); }
    };

    app.appendChild(el("div", { class: "deckbar" }, [el("h1", { text: o.title }), counter]));
    app.appendChild(el("div", { class: "progress" }, [bar]));
    app.appendChild(el("div", { class: "stage" }, [card]));
    app.appendChild(el("div", { class: "controls" }, [prev, flip, next]));
    app.appendChild(el("div", { class: "tools" }, o.english ? [shuf, eng, again] : [shuf, again]));
    var keys = el("div", { class: "keys" });
    keys.innerHTML = "<kbd>Space</kbd> উল্টাও · <kbd>←</kbd> <kbd>→</kbd> আগের ও পরের · <kbd>S</kbd> এলোমেলো";
    app.appendChild(keys);
    render();
  }

  function route() {
    deck = null; keyHandler = null;
    var parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    if (parts[0] === "kanji" && KANJI) { routeKanji(parts); window.scrollTo(0, 0); return; }
    var book = parts[0] ? findBook(parts[0]) : null;
    if (!book) { viewHome(); return; }
    var n = parseInt(parts[1], 10);
    var lesson = n ? book.lessons.filter(function (l) { return l.n === n; })[0] : null;
    if (!lesson) { viewBook(book); } else { viewDeck(book, lesson); }
    window.scrollTo(0, 0);
  }
  document.addEventListener("keydown", function (e) { if (keyHandler) keyHandler(e); });
  // Space always flips the card, so a focused button must not also fire on key-up
  document.addEventListener("keyup", function (e) { if (keyHandler && e.key === " ") e.preventDefault(); });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
